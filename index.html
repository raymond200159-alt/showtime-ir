<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHOWTIME 秀泰影城｜異常報告書 Incident Report</title>

<!-- 匯出 Excel / PDF 使用。開啟 HTML 時需可連線載入 CDN。 -->
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --purple:#5b1a8b;
  --purple-dark:#421064;
  --purple-soft:#f1eaf7;
  --gray:#b6b8ba;
  --ink:#2e2d32;
  --muted:#77737d;
  --line:#cfcbd3;
  --bg:#f4f2f6;
  --white:#fff;
  --ok:#1c7a4a;
  --danger:#b23a48;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;
  color:var(--ink);
  background:var(--bg);
}
.app-header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(115deg,var(--purple-dark),var(--purple));
  color:white;
  box-shadow:0 4px 18px rgba(0,0,0,.16);
}
.app-header-inner{
  max-width:1500px;margin:auto;padding:14px 22px;
  display:flex;align-items:center;gap:18px;
}
.brand-logo{
  background:#fff;border-radius:12px;padding:7px 11px;
  width:auto;height:58px;max-width:180px;object-fit:contain;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.header-copy h1{margin:0;font-size:22px;letter-spacing:.4px}
.header-copy p{margin:4px 0 0;font-size:12px;opacity:.86}
.header-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;
  font-size:13px;transition:.15s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:#fff;color:var(--purple)}
.btn-accent{background:#eadcf4;color:var(--purple-dark)}
.btn-ghost{background:rgba(255,255,255,.14);color:white;border:1px solid rgba(255,255,255,.25)}
.btn-danger{background:#f7e4e7;color:var(--danger)}
.layout{
  max-width:1500px;margin:18px auto;padding:0 18px 30px;
  display:grid;grid-template-columns:minmax(430px, .9fr) minmax(690px, 1.35fr);gap:18px;
  align-items:start;
}
.panel{
  background:white;border:1px solid #e6e1e8;border-radius:14px;
  box-shadow:0 8px 28px rgba(46,30,60,.08);overflow:hidden;
}
.panel-title{
  padding:14px 18px;background:var(--purple-soft);border-bottom:1px solid #dfd6e6;
  font-weight:800;color:var(--purple-dark);display:flex;align-items:center;justify-content:space-between;
}
.form-wrap{padding:16px 18px 22px}
.section-title{
  margin:18px 0 10px;padding-left:9px;border-left:4px solid var(--purple);
  color:var(--purple-dark);font-weight:800;font-size:15px;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
.field label{font-size:12px;font-weight:700;color:#4d4851}
.field small{font-size:11px;color:var(--muted);line-height:1.45}
input,select,textarea{
  width:100%;border:1px solid #cfc9d3;border-radius:8px;padding:10px 11px;
  font:inherit;font-size:13px;background:white;color:var(--ink);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(91,26,139,.10)}
textarea{min-height:98px;resize:vertical;line-height:1.55}
textarea.tall{min-height:190px}
.inline-options{display:flex;gap:16px;align-items:center;min-height:40px;padding:6px 0}
.inline-options label{font-weight:500;display:flex;gap:6px;align-items:center}
.inline-options input{width:auto}
.upload-box{
  border:2px dashed #b9a8c7;background:#faf7fc;border-radius:12px;padding:16px;text-align:center;
}
.upload-box input{display:none}
.upload-label{
  display:inline-flex;align-items:center;gap:7px;padding:10px 14px;
  border-radius:8px;background:var(--purple);color:white;font-weight:800;cursor:pointer;
}
.photo-list{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.photo-row{
  display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;
  border:1px solid #ddd5e2;border-radius:9px;padding:8px;background:white;
}
.photo-row img{width:58px;height:48px;object-fit:cover;border-radius:6px}
.photo-row input{padding:7px 8px}
.photo-seq{font-size:11px;color:var(--muted);margin-top:3px}
.preview-shell{padding:14px;background:#ddd9df;overflow:auto;max-height:calc(100vh - 110px)}
.pdf-page{
  width:794px;min-height:1123px;margin:0 auto 18px;background:white;
  box-shadow:0 2px 12px rgba(0,0,0,.16);padding:24px 26px 28px;
  position:relative;
}
.report-head{
  background:linear-gradient(115deg,var(--purple-dark),var(--purple));
  color:white;padding:15px 18px;margin-bottom:17px;
  display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center;
  border-radius:3px;
}
.report-head .brand-badge{
  background:#fff;border-radius:10px;padding:8px 10px;height:78px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(0,0,0,.16);
}
.report-head .brand-badge img{
  display:block;width:auto;height:62px;max-width:110px;object-fit:contain;
}
.report-head .title{font-size:23px;font-weight:800;letter-spacing:.35px}
.report-head .sub{font-size:12px;font-style:italic;opacity:.86;margin-top:4px}
.ir-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.ir-table th,.ir-table td{border:1px solid #a9a6ad;padding:7px 8px;vertical-align:top;line-height:1.55;word-break:break-word}
.ir-table th{background:#eee6f4;text-align:left;width:16%;font-weight:800}
.ir-table td{background:#fff}
.ir-table .wide-label{width:16%}
.ir-table .process{height:240px}
.placeholder{color:#aaa;font-style:italic}
.attach-lines{white-space:pre-wrap;line-height:1.7}
.follow-box{
  margin-top:14px;border:1px solid #aaa7ad;display:grid;grid-template-columns:150px 1fr;min-height:125px;font-size:12px
}
.follow-box .label{background:#eee6f4;padding:10px;font-weight:800}
.follow-box .value{padding:10px;white-space:pre-wrap;line-height:1.6}
.footer-note{
  position:absolute;left:26px;right:26px;bottom:16px;text-align:center;font-size:10px;color:#8b8790
}
.attachment-page h2{margin:0;color:var(--purple);font-size:21px}
.attachment-page .meta{margin:5px 0 14px;font-size:11px;color:#777}
.attachment-card{border:1px solid #c9c4cd;border-radius:8px;padding:10px;margin:0 0 14px;page-break-inside:avoid}
.attachment-card .cap{font-weight:800;margin-bottom:8px;font-size:13px}
.attachment-card img{display:block;width:100%;max-height:405px;object-fit:contain;background:#f5f5f5}
.attachment-card .desc{font-size:11px;color:#555;margin-top:7px;white-space:pre-wrap}
.status{
  padding:4px 8px;border-radius:999px;background:#e8f5ee;color:var(--ok);font-size:11px;font-weight:700
}
.case-status-box{display:flex;gap:7px;margin:5px 0 10px;max-width:310px}
.case-status-btn{
  flex:0 0 145px;border:1px solid #cfc9d3;background:#fff;color:#5d5762;border-radius:7px;
  padding:7px 10px;font-weight:800;cursor:pointer;font-size:12px;
}
.case-status-btn.active-closed{background:#e8f5ee;border-color:#78b994;color:#17633d}
.case-status-btn.active-open{background:#fff0f1;border-color:#d89aa1;color:#a12d3a}
.case-badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.case-badge.closed{background:#e8f5ee;color:#17633d}
.case-badge.open{background:#fff0f1;color:#a12d3a}
.notice{
  margin:0 0 12px;padding:10px 12px;border-radius:8px;background:#fff8e8;border:1px solid #f0d89d;
  font-size:12px;line-height:1.5;color:#6e571c;
}
@media(max-width:1150px){
  .layout{grid-template-columns:1fr}
  .preview-shell{max-height:none}
}
@media(max-width:650px){
  .grid-2{grid-template-columns:1fr}
  .header-actions{display:none}
  .app-header-inner{align-items:flex-start}
}
@media print{
  body{background:white}
  .app-header,.editor-panel,.panel-title{display:none!important}
  .layout{display:block;margin:0;padding:0;max-width:none}
  .preview-panel{border:0;box-shadow:none}
  .preview-shell{background:white;padding:0;overflow:visible;max-height:none}
  .pdf-page{box-shadow:none;margin:0;page-break-after:always;width:210mm;min-height:297mm;padding:8mm}
}
</style>
</head>

      <button class="btn btn-ghost" id="saveDraftBtn">儲存草稿</button>
      <button class="btn btn-accent" id="excelBtn">匯出 Excel</button>
      <button class="btn btn-primary" id="pdfBtn">匯出 PDF</button>
      <button class="btn btn-accent" id="printBtn">列印</button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="panel editor-panel">
    <div class="panel-title">
      <span>IR 資料輸入</span>
      <span class="status" id="statusText">即時預覽中</span>
    </div>
    <div class="form-wrap">
      <div class="notice">附件照片會依上傳順序自動編為「附件 1、附件 2…」。若調整照片順序，附件序號也會同步更新。</div>

      <div class="section-title">基本資料</div>
      <div class="grid-2">
        <div class="field"><label>日期</label><input id="date" type="date"></div>
        <div class="field"><label>事件發生時間</label><input id="time" type="time"></div>
        <div class="field"><label>第一時間處理人員</label><input id="firstHandler" placeholder="姓名"></div>
        <div class="field"><label>值班經理</label><input id="dutyManager" placeholder="姓名"></div>
        <div class="field">
          <label>事件分類</label>
          <select id="category">
            <option value="">請選擇</option>
            <option>影城-樓層相關</option>
            <option>影城-放映相關</option>
            <option>影城-票務相關</option>
            <option>影城-賣場相關</option>
            <option>影城-顧客服務相關</option>
            <option>影城-其他</option>
          </select>
        </div>
        <div class="field"><label>事件相關</label><input id="related" placeholder="例：樓層設備故障／放映異常／顧客糾紛"></div>
        <div class="field"><label>事件發生影城</label><input id="cinema" placeholder="填寫影城全名"></div>
        <div class="field"><label>發生地點</label><input id="location" placeholder="例：B廳、洗手間、手扶梯"></div>
      </div>

      <div class="grid-2">
        <div class="field"><label>影片名稱</label><input id="movie" placeholder="非放映類可填「無」"></div>
        <div class="field"><label>影片場次時間</label><input id="showtime" placeholder="例：19:20 場"></div>
      </div>
      <div class="field"><label>事件主旨</label><input id="subject" placeholder="用一句話簡述事件重點"></div>

      <div class="section-title">事件處理過程</div>
      <div class="field">
        <label>影城部說明</label>
        <textarea id="process" class="tall" placeholder="請以時間軸方式逐項記錄，每筆標明時間點＋發生什麼事／誰通知誰／採取什麼行動，直到事件結案為止。"></textarea>
        <small>建議結尾加註：「此狀況已告知 GM OOO 後並發此 IR 備查」。</small>
      </div>

      <div class="section-title">賠償 / 追蹤 / 發券</div>
      <div class="grid-2">
        <div class="field">
          <label>是否賠償</label>
          <select id="compensation"><option>否</option><option>是</option></select>
        </div>
        <div class="field">
          <label>是否追蹤</label>
          <select id="followRequired"><option>不需追蹤</option><option>需追蹤</option></select>
        </div>
        <div class="field"><label>追蹤部門</label><input id="followDept" placeholder="例：工程部、賣場部"></div>
        <div class="field"><label>發出券種</label><input id="voucher" placeholder="無則填「無」"></div>
        <div class="field">
          <label>EIP 是否填寫</label>
          <select id="eip"><option>未填寫</option><option>已填寫</option></select>
        </div>
        <div class="field"><label>張數</label><input id="qty" type="number" min="0" value="0"></div>
      </div>

      <div class="section-title">後續追蹤 & 改善行動</div>
      <div class="field">
        <textarea id="improvement" placeholder="已完全結案且無需後續請填「無」；如需改善，請具體說明負責人、改善方式與預計完成日期。"></textarea>
      </div>

      <div style="font-size:12px;font-weight:800;color:var(--purple-dark);margin:7px 0 2px">案件狀態</div>
      <div class="case-status-box">
        <button type="button" class="case-status-btn active-open" id="openCaseBtn">● 未結案</button>
        <button type="button" class="case-status-btn" id="closeCaseBtn">✓ 結案</button>
      </div>
      <input type="hidden" id="caseStatus" value="未結案">

      <div class="section-title">附件照片</div>
      <div class="upload-box">
        <input id="photos" type="file" accept="image/*" multiple>
        <label class="upload-label" for="photos">＋ 上傳照片</label>
        <div style="font-size:11px;color:#777;margin-top:8px">支援多張圖片；上傳後自動建立附件序號</div>
      </div>
      <div class="photo-list" id="photoList"></div>

      <div style="display:flex;gap:9px;margin-top:18px;flex-wrap:wrap">
        <button class="btn" style="background:var(--purple);color:white" id="excelBtn2">匯出 Excel</button>
        <button class="btn" style="background:var(--purple-dark);color:white" id="pdfBtn2">匯出 PDF</button>
        <button class="btn" style="background:#70409a;color:white" id="printBtn2">列印</button>
        <button class="btn btn-danger" id="resetBtn">清空表單</button>
      </div>
    </div>
  </section>

  <section class="panel preview-panel">
    <div class="panel-title">
      <span>表單預覽</span>
      <span style="font-size:11px;font-weight:500">A4 直式</span>
    </div>
    <div class="preview-shell" id="previewShell"></div>
  </section>
</main>

const fieldIds = [
  "caseStatus","date","time","firstHandler","dutyManager","category","related","cinema","location",
  "movie","showtime","subject","process","compensation","followRequired","followDept",
  "voucher","eip","qty","improvement"
];
const photos = [];
const $ = id => document.getElementById(id);

function escapeHtml(s=""){
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function val(id){
  const v = $(id)?.value ?? "";
  return v.trim ? v.trim() : v;
}
function display(v, placeholder="—"){
  return v ? escapeHtml(v) : `<span class="placeholder">${placeholder}</span>`;
}
function formatDate(v){
  if(!v) return "";
  const p=v.split("-");
  return p.length===3 ? `${p[0]}/${p[1]}/${p[2]}` : v;
}
function getData(){
  const d={};
  fieldIds.forEach(id=>d[id]=val(id));
  return d;
}
function attachmentText(){
  if(!photos.length) return "無";
  return photos.map((p,i)=>`${i+1}　${p.caption || "現場照片"}`).join("\n");
}

      </tr>

        <th>附件序號</th>
        <td colspan="3" class="attach-lines">${escapeHtml(attachmentText())}</td>
      </tr>
    </table>

    <div class="follow-box">
      <div class="label">後續追蹤 & 改善行動</div>
      <div class="value">${display(d.improvement,"若已完全結案且無需後續，請填「無」")}</div>
    </div>
    <div class="footer-note">本表單為秀泰影城內部使用文件，格式與識別依公司 CIS 規範製作。</div>
  </article>`;

  let attachmentPages="";
  if(photos.length){
    const perPage=2;
    for(let i=0;i<photos.length;i+=perPage){
      const batch=photos.slice(i,i+perPage);
      attachmentPages += `
      <article class="pdf-page attachment-page">
        <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--purple);padding-bottom:10px;margin-bottom:14px">
          <div>
            <h2>附件佐證</h2>
            <div class="meta">${escapeHtml(d.cinema || "秀泰影城")}｜${escapeHtml(formatDate(d.date) || "")}｜${escapeHtml(d.subject || "")}</div>
          </div>
          <img src="${LOGO}" style="width:145px;height:58px;object-fit:contain">
        </div>
        ${batch.map((p,idx)=>{
          const seq=i+idx+1;
          return `<div class="attachment-card">
            <div class="cap">附件 ${seq}｜${escapeHtml(p.caption || "現場照片")}</div>
            <img src="${p.dataUrl}">
            <div class="desc">${escapeHtml(p.note || "")}</div>
          </div>`;
        }).join("")}
        <div class="footer-note">SHOWTIME CINEMAS｜Incident Report Attachment</div>
      </article>`;
    }
  }
  $("previewShell").innerHTML = firstPage + attachmentPages;
}

function renderPhotoList(){
  const box=$("photoList");
  box.innerHTML="";
  photos.forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="photo-row";
    row.innerHTML=`
      <img src="${p.dataUrl}">
      <div>
        <input data-caption="${i}" value="${escapeHtml(p.caption || "現場照片")}" placeholder="附件名稱">
        <input data-note="${i}" value="${escapeHtml(p.note || "")}" placeholder="備註（可不填）" style="margin-top:5px">
        <div class="photo-seq">附件 ${i+1}｜${escapeHtml(p.name)}</div>
      </div>
      <button class="btn btn-danger" data-remove="${i}" type="button">刪除</button>`;
    box.appendChild(row);
  });
  box.querySelectorAll("[data-caption]").forEach(el=>{
    el.addEventListener("input",e=>{photos[+e.target.dataset.caption].caption=e.target.value;renderPreview();});
  });
  box.querySelectorAll("[data-note]").forEach(el=>{
    el.addEventListener("input",e=>{photos[+e.target.dataset.note].note=e.target.value;renderPreview();});
  });
  box.querySelectorAll("[data-remove]").forEach(el=>{
    el.addEventListener("click",e=>{photos.splice(+e.target.dataset.remove,1);renderPhotoList();renderPreview();});
  });
}

$("photos").addEventListener("change", async e=>{
  const files=[...e.target.files];
  for(const file of files){
    if(!file.type.startsWith("image/")) continue;
    const dataUrl=await new Promise((resolve,reject)=>{
      const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file);
    });
    photos.push({name:file.name,dataUrl,caption:"現場照片",note:""});
  }
  e.target.value="";
  renderPhotoList();renderPreview();
});

fieldIds.forEach(id=>{
  $(id).addEventListener("input",renderPreview);
  $(id).addEventListener("change",renderPreview);
});

function safeFileName(){
  const d=getData();
  const date=(d.date || new Date().toISOString().slice(0,10)).replaceAll("-","");
  const cinema=(d.cinema || "秀泰影城").replace(/[\\/:*?"<>|]/g,"");
  const subject=(d.subject || "異常報告書").replace(/[\\/:*?"<>|]/g,"").slice(0,30);
  return `${date}_${cinema}_${subject}`;
}

async function getImageSize(dataUrl){
  return await new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>resolve({width:img.naturalWidth||img.width,height:img.naturalHeight||img.height});
    img.onerror=()=>resolve({width:1200,height:800});
    img.src=dataUrl;
  });
}

async function exportExcel(){
  if(typeof ExcelJS==="undefined"){
    alert("Excel 匯出元件載入失敗，請確認目前可連線網路後重新開啟 HTML。");
    return;
  }
  const d=getData();
  const wb=new ExcelJS.Workbook();
  wb.creator="SHOWTIME CINEMAS";
  wb.created=new Date();

  const ws=wb.addWorksheet("IR完整表單",{
    pageSetup:{
      paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0,
      margins:{left:0.25,right:0.25,top:0.3,bottom:0.35,header:0.15,footer:0.15}
    },
    views:[{showGridLines:false}]
  });

  ws.columns=[
    {width:8},{width:10},{width:18},{width:18},
    {width:8},{width:10},{width:18},{width:18}
  ];
  ws.properties.defaultRowHeight=16;

  const PURPLE="FF5B1A8B",SOFT="FFF0E8F5",WHITE="FFFFFFFF",
        INK="FF2E2D32",LINE="FFA9A6AD",MUTED="FF77737D";
  const bodyFont={name:"Microsoft JhengHei",size:8.5,color:{argb:INK}};
  const labelFont={name:"Microsoft JhengHei",size:8.5,bold:true,color:{argb:"FF3F3445"}};

  function borderAll(cell){
    cell.border={
      top:{style:"thin",color:{argb:LINE}},left:{style:"thin",color:{argb:LINE}},
      bottom:{style:"thin",color:{argb:LINE}},right:{style:"thin",color:{argb:LINE}}
    };
  }
  function colNum(s){return [...s].reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0);}
  function styleRange(r1,c1,r2,c2,opts={}){
    for(let rr=r1;rr<=r2;rr++){
      for(let cc=c1;cc<=c2;cc++){
        const cell=ws.getCell(rr,cc);
        cell.font=opts.font||bodyFont;
        cell.alignment={vertical:opts.vertical||"top",wrapText:true,horizontal:opts.horizontal||"left"};
        if(opts.fill) cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:opts.fill}};
        borderAll(cell);
      }
    }
  }
  function mergeValue(range,value,opts={}){
    ws.mergeCells(range);
    const cell=ws.getCell(range.split(":")[0]);
    const m=range.match(/([A-Z]+)(\d+):([A-Z]+)(\d+)/);
    styleRange(+m[2],colNum(m[1]),+m[4],colNum(m[3]),opts);
    cell.value=value ?? "";
    cell.font=opts.font||bodyFont;
    cell.alignment={vertical:opts.vertical||"top",horizontal:opts.horizontal||"left",wrapText:true};
  }

  for(let rr=1;rr<=4;rr++){
    for(let cc=1;cc<=8;cc++){
      ws.getCell(rr,cc).fill={type:"pattern",pattern:"solid",fgColor:{argb:PURPLE}};
    }
  }
  ws.mergeCells("A1:B4");
  ws.mergeCells("C1:H1");
  ws.mergeCells("C2:H3");
  ws.mergeCells("C4:H4");
  ws.getCell("C1").value="SHOWTIME CINEMAS";
  ws.getCell("C1").font={name:"Microsoft JhengHei",size:8,bold:true,color:{argb:WHITE}};
  ws.getCell("C2").value="秀泰影城　異常報告書 Incident Report";
  ws.getCell("C2").font={name:"Microsoft JhengHei",size:15,bold:true,color:{argb:WHITE}};
  ws.getCell("C4").value="Incident Report｜Internal Use";
  ws.getCell("C4").font={name:"Microsoft JhengHei",size:8,italic:true,color:{argb:"FFEADCF3"}};
  ["C1","C2","C4"].forEach(c=>ws.getCell(c).alignment={vertical:"middle",horizontal:"left"});
  ws.getRow(1).height=14;ws.getRow(2).height=21;ws.getRow(3).height=18;ws.getRow(4).height=14;

  const logoId=wb.addImage({base64:LOGO,extension:"png"});
  ws.addImage(logoId,{tl:{col:0.18,row:0.28},ext:{width:84,height:55},editAs:"oneCell"});

  let r=5;
  const addTwoPair=(l1,v1,l2,v2,height=22)=>{
    mergeValue(`A${r}:B${r}`,l1,{font:labelFont,fill:SOFT,vertical:"middle"});
    mergeValue(`C${r}:D${r}`,v1,{font:bodyFont,vertical:"middle"});
    mergeValue(`E${r}:F${r}`,l2,{font:labelFont,fill:SOFT,vertical:"middle"});
    mergeValue(`G${r}:H${r}`,v2,{font:bodyFont,vertical:"middle"});
    ws.getRow(r).height=height;r++;
  };
  const addFull=(label,value,height=22)=>{
    mergeValue(`A${r}:B${r}`,label,{font:labelFont,fill:SOFT,vertical:"middle"});
    mergeValue(`C${r}:H${r}`,value,{font:bodyFont,vertical:"top"});
    ws.getRow(r).height=height;r++;
  };

  addTwoPair("案件狀態",d.caseStatus || "未結案","日期",formatDate(d.date));
  addTwoPair("事件發生時間",d.time,"第一時間處理人員",d.firstHandler);
  addTwoPair("值班經理",d.dutyManager,"事件分類",d.category);
  addFull("事件相關",d.related,24);
  addTwoPair("事件發生影城",d.cinema,"發生地點",d.location,26);
  addFull("影片名稱",d.movie,22);
  addFull("影片場次時間",d.showtime,22);
  addFull("事件主旨",d.subject,24);
  addFull("事件處理過程",d.process,105);
  addTwoPair("是否賠償",d.compensation,"是否追蹤",d.followRequired,22);
  addFull("追蹤部門",d.followDept,22);

  mergeValue(`A${r}:B${r}`,"發出券種",{font:labelFont,fill:SOFT,vertical:"middle"});
  mergeValue(`C${r}:D${r}`,`${d.voucher || "無"}\nEIP 是否填寫：${d.eip}`,{font:bodyFont,vertical:"top"});
  mergeValue(`E${r}:F${r}`,"張數",{font:labelFont,fill:SOFT,vertical:"middle"});
  mergeValue(`G${r}:H${r}`,Number(d.qty||0),{font:bodyFont,vertical:"middle"});
  ws.getRow(r).height=28;r++;

  addFull("附件序號",attachmentText(),Math.max(28,photos.length*14+14));
  addFull("後續追蹤 & 改善行動",d.improvement,52);

  ws.mergeCells(`A${r}:H${r}`);
  ws.getCell(`A${r}`).value="本表單為秀泰影城內部使用文件，格式與識別依公司 CIS 規範製作。";
  ws.getCell(`A${r}`).font={name:"Microsoft JhengHei",size:7,color:{argb:MUTED}};
  ws.getCell(`A${r}`).alignment={horizontal:"center",vertical:"middle"};
  ws.getRow(r).height=14;
  r+=2;

  if(photos.length){
    for(let i=0;i<photos.length;i++){
      const p=photos[i];
      if(i>0) r+=1;

      mergeValue(`A${r}:H${r}`,`附件 ${i+1}｜${p.caption || "現場照片"}`,{
        font:{name:"Microsoft JhengHei",size:9.5,bold:true,color:{argb:PURPLE}},
        fill:"FFF7F2FA",vertical:"middle"
      });
      ws.getRow(r).height=16;r++;

      mergeValue(`A${r}:H${r}`,`${d.cinema || "秀泰影城"}｜${formatDate(d.date) || ""}｜${d.subject || ""}`,{
        font:{name:"Microsoft JhengHei",size:7.5,color:{argb:MUTED}},vertical:"middle"
      });
      ws.getRow(r).height=16;r++;

      if(p.note){
        mergeValue(`A${r}:H${r}`,p.note,{font:{name:"Microsoft JhengHei",size:8,color:{argb:"FF555555"}},vertical:"middle"});
        ws.getRow(r).height=18;r++;
      }

      const imgTop=r,imgRows=13;
      mergeValue(`A${imgTop}:H${imgTop+imgRows-1}`,"",{font:bodyFont});
      for(let rr=imgTop;rr<imgTop+imgRows;rr++) ws.getRow(rr).height=19;

      const ext=(p.dataUrl.match(/^data:image\/(png|jpeg|jpg)/i)?.[1] || "png").replace("jpg","jpeg");
      const imgId=wb.addImage({base64:p.dataUrl,extension:ext});
      const sz=await getImageSize(p.dataUrl);
      const maxW=470,maxH=250;
      const scale=Math.min(maxW/sz.width,maxH/sz.height,1);
      const w=Math.max(120,sz.width*scale),h=Math.max(80,sz.height*scale);
      ws.addImage(imgId,{tl:{col:0.45,row:imgTop-0.65},ext:{width:w,height:h},editAs:"oneCell"});
      r=imgTop+imgRows;
    }
  }

  ws.headerFooter.oddFooter="&CSHOWTIME CINEMAS｜Incident Report";
  ws.pageSetup.printArea=`A1:H${r}`;

  const dataWs=wb.addWorksheet("IR資料");
  dataWs.columns=[{width:24},{width:80}];
  const pairs=[
    ["案件狀態",d.caseStatus || "未結案"],["日期",formatDate(d.date)],["事件發生時間",d.time],["第一時間處理人員",d.firstHandler],
    ["值班經理",d.dutyManager],["事件分類",d.category],["事件相關",d.related],
    ["事件發生影城",d.cinema],["發生地點",d.location],["影片名稱",d.movie],
    ["影片場次時間",d.showtime],["事件主旨",d.subject],["事件處理過程",d.process],
    ["是否賠償",d.compensation],["是否追蹤",d.followRequired],["追蹤部門",d.followDept],
    ["發出券種",d.voucher],["EIP 是否填寫",d.eip],["張數",Number(d.qty||0)],
    ["附件序號",attachmentText()],["後續追蹤 & 改善行動",d.improvement]
  ];
  dataWs.addRow(["欄位","內容"]);
  dataWs.getRow(1).font={name:"Microsoft JhengHei",size:10,bold:true,color:{argb:WHITE}};
  dataWs.getRow(1).eachCell(c=>c.fill={type:"pattern",pattern:"solid",fgColor:{argb:PURPLE}});
  pairs.forEach(x=>dataWs.addRow(x));
  dataWs.eachRow((row,idx)=>{
    row.eachCell(cell=>{
      if(idx!==1) cell.font={name:"Microsoft JhengHei",size:9,color:{argb:INK}};
      cell.alignment={vertical:"top",wrapText:true};
    });
  });

  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  downloadBlob(blob,`${safeFileName()}.xlsx`);
}

async function exportPdf(){
  if(typeof html2canvas==="undefined" || !window.jspdf){ alert("PDF 匯出元件載入失敗，請確認目前可連線網路後重新開啟 HTML。"); return; }
  const {jsPDF}=window.jspdf;
  const pages=[...document.querySelectorAll(".pdf-page")];
  const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4",compress:true});
  for(let i=0;i<pages.length;i++){
    if(i>0) pdf.addPage();
    const canvas=await html2canvas(pages[i],{
      scale:2.4,useCORS:true,backgroundColor:"#ffffff",logging:false,
      imageTimeout:0,removeContainer:true
    });
    const img=canvas.toDataURL("image/jpeg",0.93);
    const pw=210, ph=297;
    const ratio=Math.min(pw/canvas.width,ph/canvas.height);
    const w=canvas.width*ratio,h=canvas.height*ratio;
    const x=(pw-w)/2,y=(ph-h)/2;
    pdf.addImage(img,"JPEG",x,y,w,h,"", "FAST");
  }
  pdf.save(`${safeFileName()}.pdf`);
}

function exportWord(){
  const pages=[...document.querySelectorAll(".pdf-page")];
  if(!pages.length){ alert("目前沒有可匯出的表單內容。"); return; }

  const pageHtml=pages.map((p,i)=>{
    const clone=p.cloneNode(true);
    clone.removeAttribute("id");
    clone.style.cssText="width:190mm;min-height:267mm;margin:0 auto;padding:9mm 8mm;position:relative;background:#fff;" +
      (i<pages.length-1 ? "page-break-after:always;" : "");
    return clone.outerHTML;
  }).join("");

  const wordCss=`
    @page { size:A4 portrait; margin:10mm; }
    body{font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif;color:#2e2d32;background:#fff;}
    .report-head{background:#5b1a8b;color:#fff;padding:12px 14px;margin-bottom:14px;display:table;width:100%;box-sizing:border-box;}
    .report-head .brand-badge{display:table-cell;width:112px;vertical-align:middle;background:#fff;padding:6px 8px;text-align:center;}
    .report-head .brand-badge img{height:55px;width:auto;max-width:95px;}
    .report-head>div:last-child{display:table-cell;vertical-align:middle;padding-left:14px;}
    .report-head .title{font-size:18pt;font-weight:700;}
    .report-head .sub{font-size:9pt;font-style:italic;}
    .ir-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt;}
    .ir-table th,.ir-table td{border:1px solid #a9a6ad;padding:6px 7px;vertical-align:top;line-height:1.5;}
    .ir-table th{background:#eee6f4;text-align:left;width:16%;font-weight:700;}
    .ir-table .process{height:160px;}
    .follow-box{margin-top:10px;border:1px solid #aaa7ad;display:table;width:100%;min-height:90px;font-size:9pt;}
    .follow-box .label{display:table-cell;width:120px;background:#eee6f4;padding:8px;font-weight:700;}
    .follow-box .value{display:table-cell;padding:8px;white-space:pre-wrap;}
    .footer-note{text-align:center;font-size:7pt;color:#888;margin-top:10px;}
    .attachment-page h2{color:#5b1a8b;font-size:16pt;margin:0;}
    .attachment-page .meta{font-size:8pt;color:#777;margin:4px 0 10px;}
    .attachment-card{border:1px solid #c9c4cd;padding:8px;margin:0 0 12px;page-break-inside:avoid;}
    .attachment-card .cap{font-weight:700;margin-bottom:7px;font-size:10pt;}
    .attachment-card img{display:block;max-width:170mm;max-height:105mm;width:auto;height:auto;margin:0 auto;}
    .attachment-card .desc{font-size:8pt;color:#555;margin-top:6px;white-space:pre-wrap;}
    .placeholder{color:#aaa;font-style:italic;}
  `;

  const doc=`<!DOCTYPE html>
  <html xmlns:o="urn:schemas-microsoft-com:office:office"
        xmlns:w="urn:schemas-microsoft-com:office:word"
        xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>${safeFileName()}</title>
    <style>${wordCss}</style>
  </head><body>${pageHtml}</body></html>`;

  const blob=new Blob(["\ufeff",doc],{type:"application/msword;charset=utf-8"});
  downloadBlob(blob,`${safeFileName()}.doc`);
}

function downloadBlob(blob,name){
  const a=document.createElement("a");
  const url=URL.createObjectURL(blob);
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function saveDraft(){
  const payload={data:getData(),photos};
  localStorage.setItem("showtimeIRDraft",JSON.stringify(payload));
  $("statusText").textContent="草稿已儲存";
  setTimeout(()=>$("statusText").textContent="即時預覽中",1800);
}
function loadDraft(){
  try{
    const raw=localStorage.getItem("showtimeIRDraft");
    if(!raw) return;
    const p=JSON.parse(raw);
    Object.entries(p.data||{}).forEach(([k,v])=>{if($(k))$(k).value=v ?? "";});
    (p.photos||[]).forEach(x=>photos.push(x));
    renderPhotoList();
  }catch(e){}
}
function resetForm(){
  if(!confirm("確定要清空目前 IR 資料與所有附件照片嗎？")) return;
  fieldIds.forEach(id=>$(id).value=(id==="qty"?"0":id==="compensation"?"否":id==="followRequired"?"不需追蹤":id==="eip"?"未填寫":""));
  photos.splice(0,photos.length);
  setCaseStatus("未結案");
  localStorage.removeItem("showtimeIRDraft");
  renderPhotoList();renderPreview();
}

function setCaseStatus(status){
  $("caseStatus").value=status;
  $("openCaseBtn").className="case-status-btn" + (status==="未結案" ? " active-open" : "");
  $("closeCaseBtn").className="case-status-btn" + (status==="結案" ? " active-closed" : "");
  renderPreview();
  $("statusText").textContent=status==="結案" ? "案件已結案" : "案件未結案";
}
$("openCaseBtn").onclick=()=>setCaseStatus("未結案");
$("closeCaseBtn").onclick=()=>{
  if(confirm("確定將此異常報告標記為「結案」嗎？")) setCaseStatus("結案");
};

(function init(){
  $("date").value=new Date().toISOString().slice(0,10);
  loadDraft();
  setCaseStatus($("caseStatus").value || "未結案");
  renderPreview();
})();
